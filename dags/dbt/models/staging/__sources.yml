version: 2

sources:
  - name: policy_admin
    description: Raw extracts from the policy admin system, loaded by Snowpipe as VARIANT.
    database: INS_RAW
    schema: POLICY_ADMIN
    tables:
      - name: policyholders
        description: Daily FULL snapshot of all policyholders.
        config:
          loaded_at_field: LOADED_AT
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 48, period: hour}

      - name: policies
        description: Policies issued per business date.
        config:
          loaded_at_field: LOADED_AT
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 48, period: hour}

      - name: claims
        description: New claims + status updates to older claims, per business date.
        config:
          loaded_at_field: LOADED_AT
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 48, period: hour}
