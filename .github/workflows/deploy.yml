name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::656559336744:role/airbnb-pipeline-snowflake-github-actions
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Smoke test OIDC
        run: aws sts get-caller-identity
