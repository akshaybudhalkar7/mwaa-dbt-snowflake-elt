name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::656559336744:role/test_oidc
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Smoke test OIDC
        run: aws sts get-caller-identity

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Airflow 3 compatibility scan
        run: |
          pip install ruff
          echo "--- Airflow 2 DAGs (report only) ---"
          ruff check --preview --select AIR --exit-zero dags
          echo "--- Airflow 3 DAGs (must pass) ---"
          ruff check --preview --select AIR dags_v3

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          pip install -r infra/requirements.txt

      - name: CDK diff
        working-directory: infra
        run: cdk diff

      - name: CDK deploy
        working-directory: infra
        run: cdk deploy --all --require-approval never
